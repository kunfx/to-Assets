
name: Build Assets.car

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Assets.xcassets
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "Assets.xcassets" ]; then
            echo "::error::未找到仓库根目录下的 Assets.xcassets"
            exit 1
          fi

          if [ ! -f "Assets.xcassets/Contents.json" ]; then
            echo "::error::缺少 Assets.xcassets/Contents.json"
            exit 1
          fi

          echo "=== 检查图片集数量 ==="
          find Assets.xcassets -type d -name "*.imageset" | sort

          echo "=== 检查图片集配置文件 ==="
          find Assets.xcassets -type d -name "*.imageset" \
            -exec sh -c '
              for dir do
                if [ ! -f "$dir/Contents.json" ]; then
                  echo "::error file=$dir/Contents.json::缺少 Contents.json"
                  exit 1
                fi
              done
            ' sh {} +

      - name: Compile Assets.car
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output
          rm -f output/Assets.car

          echo "=== 开始编译 Assets.xcassets ==="

          xcrun actool "Assets.xcassets" \
            --compile "$PWD/output" \
            --platform iphoneos \
            --minimum-deployment-target 13.0 \
            --target-device iphone \
            --target-device ipad \
            --output-format human-readable-text

          if [ ! -s "output/Assets.car" ]; then
            echo "::error::编译结束，但没有生成有效的 Assets.car"
            echo "=== output 目录内容 ==="
            ls -la output
            exit 1
          fi

          echo "=== 编译成功 ==="
          ls -lh output/Assets.car
          file output/Assets.car

      - name: Upload Assets.car Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-assets
          path: output/Assets.car
          if-no-files-found: error
          retention-days: 30
