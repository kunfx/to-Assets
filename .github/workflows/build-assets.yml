name: Build Assets.car

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Assets.car
        run: |
          mkdir -p output
          
          # 寻找 .xcassets 路径
          XCASSETS_PATH=$(find . -name "*.xcassets" -type d | head -n 1)
          if [ -z "$XCASSETS_PATH" ]; then
            echo "::error::未找到 .xcassets 文件夹！"
            exit 1
          fi
          
          echo "编译目标: $XCASSETS_PATH"
          
          # 执行编译
          xcrun actool "$XCASSETS_PATH" \
            --compile output \
            --platform iphoneos \
            --target-device iphone \
            --minimum-deployment-target 13.0 \
            --output-format human-readable-text

          echo "=== 检查当前目录及 output 目录下生成的文件 ==="
          ls -la output
          
          # 全局查找所有生成的 .car 文件
          CAR_FILE=$(find . -name "*.car" | head -n 1)
          
          if [ -n "$CAR_FILE" ]; then
            echo "成功找到编译产物: $CAR_FILE"
            cp "$CAR_FILE" output/Assets.car
          else
            echo "::error::未能生成任何 .car 文件！请展开当前步骤日志查看 actool 输出。"
            exit 1
          fi

      - name: Upload Assets.car Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-assets
          path: output/Assets.car
          if-no-files-found: error
