
name: Build Assets.car

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare asset catalog automatically
        shell: bash
        run: |
          set -euo pipefail

          ASSETS_PATH="$GITHUB_WORKSPACE/Assets.xcassets"

          if [ ! -d "$ASSETS_PATH" ]; then
            echo "::error::找不到 Assets.xcassets 目录"
            exit 1
          fi

          echo "=== 检查资源目录 ==="
          find "$ASSETS_PATH" -maxdepth 2 -type f | sort

          # 自动将直接位于 Assets.xcassets 下的普通目录改为 .imageset
          find "$ASSETS_PATH" -mindepth 1 -maxdepth 1 -type d \
            ! -name '*.imageset' -print0 |
          while IFS= read -r -d '' dir; do
            name="$(basename "$dir")"
            target="$ASSETS_PATH/$name.imageset"

            if [ -e "$target" ]; then
              echo "::error::目标目录已存在，无法自动重命名：$target"
              exit 1
            fi

            mv "$dir" "$target"
            echo "目录转换：$name -> $name.imageset"
          done

          # 为缺少 Contents.json 的 imageset 自动生成配置
          export ASSETS_PATH
          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["ASSETS_PATH"])
          supported = {".png", ".jpg", ".jpeg", ".heic", ".pdf"}

          for folder in sorted(root.glob("*.imageset")):
              config_path = folder / "Contents.json"

              # 已有配置不覆盖
              if config_path.exists():
                  print(f"保留现有配置：{config_path}")
                  continue

              images = []

              for file in sorted(folder.iterdir()):
                  if not file.is_file() or file.suffix.lower() not in supported:
                      continue

                  match = re.search(r"@([123])x$", file.stem)
                  scale = f"{match.group(1)}x" if match else "1x"

                  images.append({
                      "filename": file.name,
                      "idiom": "universal",
                      "scale": scale
                  })

              if not images:
                  print(f"::warning::目录没有可识别的图片：{folder.name}")
                  continue

              config = {
                  "images": images,
                  "info": {
                      "author": "xcode",
                      "version": 1
                  }
              }

              config_path.write_text(
                  json.dumps(config, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )

              print(f"已生成配置：{config_path.name}（{folder.name}，{len(images)} 张图片）")

          # 校验所有 imageset 中引用的文件是否存在
          errors = []

          for folder in sorted(root.glob("*.imageset")):
              config_path = folder / "Contents.json"

              if not config_path.exists():
                  errors.append(f"缺少配置文件：{folder.name}/Contents.json")
                  continue

              try:
                  config = json.loads(config_path.read_text(encoding="utf-8-sig"))
                  for item in config.get("images", []):
                      filename = item.get("filename")
                      if filename and not (folder / filename).is_file():
                          errors.append(f"图片不存在：{folder.name}/{filename}")
              except Exception as exc:
                  errors.append(f"配置文件格式错误：{config_path}：{exc}")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              raise SystemExit(1)

          print("资源目录及 Contents.json 检查通过")
          PY

      - name: Compile Assets.car
        shell: bash
        run: |
          set -uo pipefail

          OUTPUT_PATH="$GITHUB_WORKSPACE/output"
          ASSETS_PATH="$GITHUB_WORKSPACE/Assets.xcassets"

          mkdir -p "$OUTPUT_PATH"

          echo "=== Xcode 版本 ==="
          xcodebuild -version

          echo "=== 开始编译 Assets.xcassets ==="

          xcrun actool "$ASSETS_PATH" \
            --compile "$OUTPUT_PATH" \
            --platform iphoneos \
            --target-device iphone \
            --minimum-deployment-target 13.0 \
            --output-format human-readable-text \
            --notices \
            --warnings \
            --errors

          RESULT=$?

          echo "=== 编译结果 ==="
          find "$OUTPUT_PATH" -maxdepth 2 -type f -print

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::actool 编译失败，具体错误请查看上面的日志"
            exit "$RESULT"
          fi

          if [ ! -s "$OUTPUT_PATH/Assets.car" ]; then
            echo "::error::编译结束，但没有生成有效的 Assets.car"
            exit 1
          fi

          echo "Assets.car 编译成功"
          ls -lh "$OUTPUT_PATH/Assets.car"

      - name: Upload compiled Assets.car
        uses: actions/upload-artifact@v4
        with:
          name: compiled-assets
          path: output/Assets.car
          if-no-files-found: error
