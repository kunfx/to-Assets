name: Build Assets.car

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check files and structure
        run: |
          echo "=== 当前工作目录内容 ==="
          ls -la
          echo "=== 查找 xcassets 目录 ==="
          find . -name "*.xcassets"

      - name: Compile Assets.car
        run: |
          mkdir -p output
          
          # 自动寻找仓库里的 xcassets 目录路径
          XCASSETS_PATH=$(find . -name "*.xcassets" -type d | head -n 1)
          
          if [ -z "$XCASSETS_PATH" ]; then
            echo "::error::未在仓库中找到任何 .xcassets 文件夹！请检查目录名称。"
            exit 1
          fi
          
          echo "正在编译目标: $XCASSETS_PATH"
          
          # 执行编译并直接生成到 output 目录
          xcrun actool "$XCASSETS_PATH" \
            --compile output \
            --platform iphoneos \
            --minimum-deployment-target 13.0 \
            --output-format human-readable-text \
            --export-dependency-info output/assetcatalog_dependencies

          echo "=== output 目录内容 ==="
          ls -la output

      - name: Upload Assets.car Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-assets
          path: output/Assets.car
          if-no-files-found: error
