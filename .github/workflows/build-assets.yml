name: Build Assets.car

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许你在 GitHub 网页上点击按钮手动触发

jobs:
  build:
    runs-on: macos-latest # 使用 GitHub 免费提供的 macOS 环境

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Assets.car
        run: |
          mkdir -p output
          # 调用 Xcode 原生 actool 编译工具
          xcrun actool Assets.xcassets \
            --compile output \
            --platform iphoneos \
            --minimum-deployment-target 13.0 \
            --output-format human-readable-text

      - name: Upload Assets.car Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-assets
          path: output/Assets.car
